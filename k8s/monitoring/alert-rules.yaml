apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shopnow-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: shopnow.rules
      rules:
        - alert: PodDown
          expr: kube_pod_status_phase{namespace="shopnow", phase=~"Failed|Unknown"} > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} in shopnow namespace is down"
            description: "Pod {{ $labels.pod }} has been in {{ $labels.phase }} state for more than 2 minutes."

        - alert: HighCPUUsage
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="shopnow"}[5m])) by (pod) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on pod {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} has been using more than 80% CPU for 5 minutes."

        - alert: JenkinsBuildFailed
          expr: default_jenkins_builds_last_build_result_ordinal{jenkins_job="capstone-devops-pipeline"} != 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Jenkins build failed for {{ $labels.jenkins_job }}"
            description: "The last build of {{ $labels.jenkins_job }} did not succeed."

        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_available{namespace="shopnow"} < kube_deployment_spec_replicas{namespace="shopnow"}
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
            description: "Deployment {{ $labels.deployment }} in shopnow has fewer available replicas than desired for more than 1 minute."
